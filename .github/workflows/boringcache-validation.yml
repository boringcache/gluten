name: BoringCache Velox native-library validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boringcache-gluten-validation
  cancel-in-progress: false

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  VELOX_IMAGE: docker.io/apache/gluten@sha256:d7d128670f4ab6945327e83a1304b6f2d7b5c4589e891a2ae22936103c90f4f8
  VELOX_COMMIT: 5e02332156f15759dc7d6ec1c8fa38b3ae96b956

jobs:
  publish:
    name: Build and publish the native library
    if: github.repository == 'boringcache/gluten' && github.ref == 'refs/heads/boringcache-validation'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify the upstream source and native-library identity
        run: |
          set -euo pipefail
          source_commit=$(cat .github/boringcache-source)
          expected=$(cat .github/boringcache-velox-inputs.sha256)
          git diff --exit-code "$source_commit" -- . \
            ':!.boringcache.toml' \
            ':!.github/boringcache-source' \
            ':!.github/boringcache-velox-inputs.sha256' \
            ':!.github/workflows/boringcache-*'
          actual=$(
            {
              git ls-tree -r "$source_commit" -- cpp dev ep/build-velox
              printf '%s\n' \
                "image=${VELOX_IMAGE}" \
                "velox=${VELOX_COMMIT}" \
                'NUM_THREADS=4' \
                'builddeps=--enable_vcpkg=ON --build_arrow=OFF --build_tests=OFF --build_benchmarks=OFF --build_examples=OFF --enable_s3=ON --enable_gcs=ON --enable_hdfs=ON --enable_abfs=ON'
            } | sha256sum | cut -d ' ' -f 1
          )
          test "$actual" = "$expected"
          remote_velox=$(git ls-remote https://github.com/IBM/velox.git dft-2026_09_10 | awk 'NR == 1 { print $1 }')
          test "$remote_velox" = "$VELOX_COMMIT"

      - name: Restore the existing Apache Stash compiler cache
        uses: apache/infrastructure-actions/stash/restore@69afc125e535c4c41e7f1b7470f583087e0f344b
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-centos7-release-default-${{ hashFiles('ep/build-velox/src/**') }}

      - name: Configure BoringCache native-library storage
        id: cache
        uses: boringcache/one@1039999c65011be670f5655e0e48ad556188ab12 # v1.30.4
        with:
          mode: archive
          trust-policy: publish
          cache-profiles: velox-native
          diagnostics: summary
          fail-on-cache-error: true

      - name: Build the native library from clean output
        run: |
          set -euo pipefail
          rm -rf cpp/build
          /usr/bin/time -v docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$VELOX_IMAGE" \
            bash -c '
              set -e
              yum install tzdata -y
              df -a
              export CCACHE_DIR=/work/.ccache
              export CCACHE_MAXSIZE=1G
              mkdir -p /work/.ccache
              ccache -sz
              bash dev/ci-velox-buildstatic-centos-7.sh
              ccache -s
              cp .github/boringcache-velox-inputs.sha256 cpp/build/.boringcache-input-digest
            '
          test -d cpp/build/releases
          find cpp/build/releases -type f -print -quit | grep -q .

      - name: Save the Apache Stash compiler cache
        if: always()
        uses: apache/infrastructure-actions/stash/save@0ba14156c9f4c3cfbe4b0c9f36339ab0f8d81e53
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-centos7-release-default-${{ hashFiles('ep/build-velox/src/**') }}
          include-hidden-files: true

      - name: Retain BoringCache evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: boringcache-velox-publish-evidence
          path: ${{ steps.cache.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 30

  restore:
    name: Restore the native library on a clean runner
    needs: publish
    if: github.repository == 'boringcache/gluten' && github.ref == 'refs/heads/boringcache-validation'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify the upstream source and native-library identity
        run: |
          set -euo pipefail
          source_commit=$(cat .github/boringcache-source)
          expected=$(cat .github/boringcache-velox-inputs.sha256)
          git diff --exit-code "$source_commit" -- . \
            ':!.boringcache.toml' \
            ':!.github/boringcache-source' \
            ':!.github/boringcache-velox-inputs.sha256' \
            ':!.github/workflows/boringcache-*'
          actual=$(
            {
              git ls-tree -r "$source_commit" -- cpp dev ep/build-velox
              printf '%s\n' \
                "image=${VELOX_IMAGE}" \
                "velox=${VELOX_COMMIT}" \
                'NUM_THREADS=4' \
                'builddeps=--enable_vcpkg=ON --build_arrow=OFF --build_tests=OFF --build_benchmarks=OFF --build_examples=OFF --enable_s3=ON --enable_gcs=ON --enable_hdfs=ON --enable_abfs=ON'
            } | sha256sum | cut -d ' ' -f 1
          )
          test "$actual" = "$expected"

      - name: Configure BoringCache native-library storage
        id: cache
        uses: boringcache/one@1039999c65011be670f5655e0e48ad556188ab12 # v1.30.4
        with:
          mode: archive
          trust-policy: restore
          cache-profiles: velox-native
          diagnostics: summary
          fail-on-cache-miss: true
          fail-on-cache-error: true

      - name: Verify the restored native library
        run: |
          set -euo pipefail
          cmp .github/boringcache-velox-inputs.sha256 cpp/build/.boringcache-input-digest
          test -d cpp/build/releases
          find cpp/build/releases -type f -print -quit | grep -q .
          du -sh cpp/build

      - name: Retain BoringCache evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: boringcache-velox-restore-evidence
          path: ${{ steps.cache.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 30
